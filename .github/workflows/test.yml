
name: Download and Upload to Telegram

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Direct video URL"
        required: true
        type: string

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. Cache Telegram Bot API
      # ==========================================

      - name: Restore Telegram Bot API cache
        id: telegram-cache
        uses: actions/cache@v4
        with:
          path: telegram-bot-api/build/telegram-bot-api
          key: telegram-bot-api-${{ runner.os }}-v1


      # ==========================================
      # 3. Install dependencies
      # ==========================================

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            cmake \
            gperf \
            build-essential \
            zlib1g-dev \
            libssl-dev \
            curl


      # ==========================================
      # 4. Build Telegram Bot API
      # ==========================================

      - name: Build Telegram Bot API
        if: steps.telegram-cache.outputs.cache-hit != 'true'
        run: |
          set -e

          echo "Downloading Telegram Bot API..."

          git clone --recursive \
            https://github.com/tdlib/telegram-bot-api.git

          echo "Configuring..."

          cmake \
            -S telegram-bot-api \
            -B telegram-bot-api/build \
            -DCMAKE_BUILD_TYPE=Release

          echo "Building..."

          cmake \
            --build telegram-bot-api/build \
            --target telegram-bot-api \
            -j2

          echo "Telegram Bot API build completed."


      # ==========================================
      # 5. Start Local Telegram Bot API
      # ==========================================

      - name: Start Telegram Local Bot API
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -e

          mkdir -p telegram-data

          echo "Starting Telegram Bot API..."

          ./telegram-bot-api/build/telegram-bot-api \
            --api-id="$TELEGRAM_API_ID" \
            --api-hash="$TELEGRAM_API_HASH" \
            --local \
            --dir="$PWD/telegram-data" \
            --http-port=8081 \
            > telegram-api.log 2>&1 &

          echo $! > telegram-api.pid

          echo "Waiting for Telegram Bot API..."

          for i in {1..30}; do

            if curl -s \
              http://127.0.0.1:8081/ \
              > /dev/null; then

              echo "Telegram Bot API is ready!"
              exit 0

            fi

            sleep 2

          done

          echo "Telegram Bot API failed to start."

          cat telegram-api.log

          exit 1


      # ==========================================
      # 6. Test Bot
      # ==========================================

      - name: Test Telegram Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -e

          echo "Testing Telegram bot..."

          curl \
            --fail-with-body \
            -sS \
            "http://127.0.0.1:8081/bot${TELEGRAM_BOT_TOKEN}/getMe"

          echo ""
          echo "Bot is working."


      # ==========================================
      # 7. Download Video
      # ==========================================

      - name: Download video
        run: |
          set -e

          VIDEO="$GITHUB_WORKSPACE/video.mp4"

          echo "Downloading video..."

          wget \
            --progress=dot:giga \
            -O "$VIDEO" \
            "${{ inputs.url }}"

          echo ""
          echo "Download completed."

          ls -lh "$VIDEO"

          echo ""
          echo "Checking file..."

          test -f "$VIDEO"
          test -r "$VIDEO"

          echo "File is readable."


      # ==========================================
      # 8. Upload Video
      # ==========================================

      - name: Upload to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          set -euo pipefail

          VIDEO="$GITHUB_WORKSPACE/video.mp4"

          echo "================================"
          echo "FILE CHECK"
          echo "================================"

          test -f "$VIDEO"
          test -r "$VIDEO"

          ls -lh "$VIDEO"

          echo ""
          echo "================================"
          echo "CURL VERSION"
          echo "================================"

          curl --version

          echo ""
          echo "================================"
          echo "STARTING TELEGRAM UPLOAD"
          echo "================================"

          curl \
            --fail-with-body \
            --verbose \
            --form "chat_id=${TELEGRAM_CHANNEL_ID}" \
            --form "document=@${VIDEO};filename=video.mp4;type=video/mp4" \
            "http://127.0.0.1:8081/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            2>&1 | tee telegram-result.json

          echo ""
          echo "================================"
          echo "UPLOAD REQUEST FINISHED"
          echo "================================"


      # ==========================================
      # 9. Verify Upload
      # ==========================================

      - name: Verify Telegram result
        run: |
          set -e

          echo "===== Telegram Result ====="

          cat telegram-result.json

          echo ""

          if grep -q '"ok":true' telegram-result.json; then
            echo "================================"
            echo "UPLOAD SUCCESSFUL"
            echo "================================"
          else
            echo "================================"
            echo "UPLOAD FAILED"
            echo "================================"

            exit 1
          fi


      # ==========================================
      # 10. Cleanup
      # ==========================================

      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning temporary files..."

          rm -f "$GITHUB_WORKSPACE/video.mp4"

          echo "Temporary video deleted."

          echo ""
          echo "===== Telegram API Log ====="

          cat telegram-api.log || true

