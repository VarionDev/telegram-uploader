name: Telegram Upload Test

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Video URL"
        required: true
        type: string

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Install yt-dlp
        run: |
          python3 -m pip install --upgrade yt-dlp

      - name: Download video
        run: |
          yt-dlp \
            --no-playlist \
            -f "bv*+ba/b" \
            --merge-output-format mp4 \
            -o "video.%(ext)s" \
            "${{ inputs.url }}"

      - name: Check file
        run: |
          ls -lh video.mp4
          du -h video.mp4

      - name: Download Telegram Bot API Server
        run: |
          wget -q https://github.com/tdlib/telegram-bot-api/releases/latest/download/telegram-bot-api.tar.gz
          tar -xzf telegram-bot-api.tar.gz

      - name: Start Local Bot API
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          mkdir -p telegram-data

          ./telegram-bot-api/bin/telegram-bot-api \
            --api-id="${TELEGRAM_API_ID}" \
            --api-hash="${TELEGRAM_API_HASH}" \
            --local \
            --dir="$PWD/telegram-data" \
            > telegram-api.log 2>&1 &

          sleep 5

          cat telegram-api.log

      - name: Upload to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -v \
            -F "chat_id=@${TELEGRAM_BOT_TOKEN}" \
            http://127.0.0.1:8081/bot${TELEGRAM_BOT_TOKEN}/getMe
