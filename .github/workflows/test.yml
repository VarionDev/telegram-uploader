name: Download Video

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Video URL"
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Install yt-dlp
        run: |
          python3 -m pip install --upgrade yt-dlp

      - name: Download video
        run: |
          yt-dlp \
            --no-playlist \
            -f "bv*+ba/b" \
            --merge-output-format mp4 \
            -o "video.%(ext)s" \
            "${{ inputs.url }}"

      - name: Check downloaded file
        run: |
          ls -lh
          du -sh .
