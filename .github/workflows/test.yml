name: Test Telegram Local Bot API

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            cmake \
            gperf \
            build-essential \
            zlib1g-dev \
            libssl-dev

      - name: Build Telegram Bot API
        run: |
          git clone --recursive https://github.com/tdlib/telegram-bot-api.git

          cmake \
            -S telegram-bot-api \
            -B telegram-bot-api/build \
            -DCMAKE_BUILD_TYPE=Release

          cmake \
            --build telegram-bot-api/build \
            --target telegram-bot-api \
            -j2

      - name: Start Telegram Local Bot API
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          mkdir -p telegram-data

          ./telegram-bot-api/build/telegram-bot-api \
            --api-id="$TELEGRAM_API_ID" \
            --api-hash="$TELEGRAM_API_HASH" \
            --local \
            --dir="$PWD/telegram-data" \
            --http-port=8081 \
            > telegram-api.log 2>&1 &

          echo $! > telegram-api.pid

          echo "Waiting for Telegram Bot API..."

          for i in {1..30}; do
            if curl -s http://127.0.0.1:8081/ > /dev/null; then
              echo "Telegram Local Bot API is running!"
              break
            fi

            sleep 2
          done

      - name: Test Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          echo "Testing bot..."

          curl -sS \
            "http://127.0.0.1:8081/bot${TELEGRAM_BOT_TOKEN}/getMe"

      - name: Show Telegram API log
        if: always()
        run: |
          cat telegram-api.log || true
